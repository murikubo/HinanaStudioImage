name: macOS desktop builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            nativeArch: arm64
          - runner: macos-15-intel
            arch: x64
            nativeArch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build web, Electron and native macOS helpers
        run: npm run build
      - run: npm test
      - name: Package architecture-specific DMG
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never '-c.mac.artifactName=Hinana-Studio-Image-${version}-macOS-${arch}.${ext}'
      - name: Check native helper architectures
        run: |
          file native/bin/hinana-raw native/bin/hinana-hdr
          lipo native/bin/hinana-raw -verify_arch ${{ matrix.nativeArch }}
          lipo native/bin/hinana-hdr -verify_arch ${{ matrix.nativeArch }}
      - name: Test packaged app and preset persistence/import/export
        run: |
          APP_PATH=$(find release -maxdepth 2 -type d -name 'Hinana Studio Image.app' -print -quit)
          test -n "$APP_PATH"
          export HINANA_TEST_APP="$GITHUB_WORKSPACE/$APP_PATH/Contents/MacOS/Hinana Studio Image"
          node tests/presets-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hinana-Studio-Image-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.blockmap
            release/preset-library.png
            release/presets-failure.png
          if-no-files-found: warn
          retention-days: 14
