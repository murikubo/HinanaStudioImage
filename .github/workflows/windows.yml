name: Windows build and smoke tests
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows app
        run: node tests/smoke.mjs
        env:
          HINANA_TEST_APP: ${{ github.workspace }}\release\win-unpacked\Hinana Studio Image.exe
      - name: Test Display P3 editing and ICC exports
        run: node tests/p3-smoke.mjs
        env:
          HINANA_TEST_APP: ${{ github.workspace }}\release\win-unpacked\Hinana Studio Image.exe
      - name: Test HDR and 16-bit editing / exports
        run: node tests/hdr-smoke.mjs
        env:
          HINANA_TEST_APP: ${{ github.workspace }}\release\win-unpacked\Hinana Studio Image.exe
      - name: Check Windows title bar layout
        run: node tests/window-layout.mjs
        env:
          HINANA_TEST_APP: ${{ github.workspace }}\release\win-unpacked\Hinana Studio Image.exe
      - name: Download pinned RAW fixture
        run: node scripts/fetch-raw-fixture.mjs "${{ runner.temp }}\hinana-test.NEF"
      - name: Test packaged RAW import, EXIF and project restore
        run: node tests/raw-smoke.mjs "${{ runner.temp }}\hinana-test.NEF"
        env:
          HINANA_TEST_APP: ${{ github.workspace }}\release\win-unpacked\Hinana Studio Image.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-x64-build-and-screenshots
          path: |
            release/*Windows*x64*Setup.exe
            docs/*.png
          retention-days: 14
