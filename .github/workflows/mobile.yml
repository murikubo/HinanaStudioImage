name: Native mobile apps
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'ios/**'
      - 'scripts/*mobile*'
      - 'scripts/*native*'
      - 'scripts/sync-version.cjs'
      - 'tests/native/**'
      - 'package*.json'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./android/gradlew -p android connectedDebugAndroidTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hinana-Studio-Image-Android-native
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/androidTests/connected/
          retention-days: 14
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure Core Image Metal compiler is available
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - run: node scripts/build-mobile.cjs --ios
      - run: node scripts/test-native-ios.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Hinana-Studio-Image-iOS-native-simulator
          path: release/ios-native-simulator/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
