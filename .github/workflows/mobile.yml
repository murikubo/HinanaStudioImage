name: Mobile apps
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'ios/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'tests/mobile-smoke.mjs'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run build:mobile && npx cap sync android
      - run: npx playwright install --with-deps chromium webkit
      - name: Test touch layouts and editing
        run: |
          npm run dev:web > /tmp/hinana-vite.log 2>&1 &
          npx wait-on http://127.0.0.1:5173
          node tests/mobile-smoke.mjs
      - run: ./android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hinana-Studio-Image-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:mobile && npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath release/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Hinana-Studio-Image-iOS-simulator
          path: release/ios/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
